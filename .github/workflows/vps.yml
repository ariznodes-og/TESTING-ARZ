##############################################################################
#                                                                            #
#   █████╗ ██████╗ ██╗███████╗███╗   ██╗ ██████╗ ██████╗ ███████╗███████╗     #
#  ██╔══██╗██╔══██╗██║╚══███╔╝████╗  ██║██╔═══██╗██╔══██╗██╔════╝██╔════╝     #
#  ███████║██████╔╝██║  ███╔╝ ██╔██╗ ██║██║   ██║██║  ██║█████╗  ███████╗     #
#  ██╔══██║██╔══██╗██║ ███╔╝  ██║╚██╗██║██║   ██║██║  ██║██╔══╝  ╚════██║     #
#  ██║  ██║██║  ██║██║███████╗██║ ╚████║╚██████╔╝██████╔╝███████╗███████║     #
#  ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝╚══════╝╚═╝  ╚═══╝ ╚═════╝ ╚═════╝ ╚══════╝╚══════╝    #
#                                                                            #
#   ULTIMATE GITHUB ACTIONS VPS — 1000+ LINE EDITION                        #
#   Runtime: 7+ hours (via self-redispatch)  |  SSH: sshx  |  User: custom   #
#                                                                            #
##############################################################################

name: ARIZNODES

on:
  workflow_dispatch:
    inputs:
      custom_username:
        description: 'Custom VPS username (default: ariznode)'
        required: false
        default: 'ariznode'
      session_hours:
        description: 'How many hours total (auto-redispatch until reached)'
        required: false
        default: '8'
      enable_docker:
        description: 'Install Docker? (true/false)'
        required: false
        default: 'true'
      enable_dev_tools:
        description: 'Install dev tools (node, python, go, rust)?'
        required: false
        default: 'true'
      enable_monitoring:
        description: 'Enable htop/btop/neofetch monitoring?'
        required: false
        default: 'true'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write   # needed for self-redispatch

# Prevent overlapping runs
concurrency:
  group: ariznodes-vps
  cancel-in-progress: false

env:
  VPS_USER: ${{ github.event.inputs.custom_username || 'ariznode' }}
  SESSION_HOURS: ${{ github.event.inputs.session_hours || '8' }}
  ENABLE_DOCKER: ${{ github.event.inputs.enable_docker || 'true' }}
  ENABLE_DEV_TOOLS: ${{ github.event.inputs.enable_dev_tools || 'true' }}
  ENABLE_MONITORING: ${{ github.event.inputs.enable_monitoring || 'true' }}
  GIT_USER_NAME: "ARIZNODES Auto-Saver"
  GIT_USER_EMAIL: "ariznodes@autosaver.local"
  BACKUP_INTERVAL_SEC: "1800"   # 30 min
  KEEPALIVE_MAX_MIN: "350"      # 5h 50m per job (below the 6h hard limit)
  TMATE_DEAD: "true"            # marker: we use sshx now

jobs:
  # ===========================================================================
  # JOB 1 — Bootstrap: prepare the runner & persist a "session" marker
  # ===========================================================================
  Bootstrap:
    name: "🔧 Bootstrap Runner"
    runs-on: ubuntu-latest
    outputs:
      sshx_url: ${{ steps.start.outputs.sshx_url }}
      session_id: ${{ steps.meta.outputs.session_id }}
      start_epoch: ${{ steps.meta.outputs.start_epoch }}
    steps:
      - name: Checkout Repo (Loading saved files)
        uses: actions/checkout@v4

      - name: Generate session metadata
        id: meta
        run: |
          SESSION_ID="ariznodes-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
          START_EPOCH=$(date +%s)
          echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT
          echo "start_epoch=$START_EPOCH" >> $GITHUB_OUTPUT
          echo "Session ID: $SESSION_ID"
          echo "Start epoch: $START_EPOCH"

      - name: Create custom user (${{ env.VPS_USER }})
        run: |
          USERNAME="${{ env.VPS_USER }}"
          # sanitize
          USERNAME=$(echo "$USERNAME" | tr -cd 'a-z0-9_-' | cut -c1-32)
          [ -z "$USERNAME" ] && USERNAME="ariznode"
          echo "Creating user: $USERNAME"
          if ! id "$USERNAME" &>/dev/null; then
            sudo useradd -m -s /bin/bash "$USERNAME" || true
          fi
          echo "$USERNAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$USERNAME >/dev/null
          sudo chmod 440 /etc/sudoers.d/$USERNAME
          # Put repo workspace under user's control
          sudo chown -R "$USERNAME":"$USERNAME" "$GITHUB_WORKSPACE" || true
          echo "USERNAME=$USERNAME" >> $GITHUB_ENV
          echo "✅ User $USERNAME created with passwordless sudo"

      - name: Install base packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl wget git vim nano tmux screen htop btop neofetch \
            zip unzip tar gzip xz-utils jq python3 python3-pip \
            net-tools iputils-ping dnsutils traceroute \
            ca-certificates gnupg lsb-release software-properties-common \
            build-essential pkg-config libssl-dev \
            rsync nano less tree ncdu \
            zsh fish 2>/dev/null || true
          echo "✅ Base packages installed"

      - name: Install sshx
        id: start
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          echo "Installing sshx..."
          curl -sSf https://sshx.io/get | sh -s -- -y >/dev/null 2>&1 || \
          curl -sSf https://sshx.io/get | bash || true

          # Verify binary
          if ! command -v sshx >/dev/null 2>&1; then
            # Fallback: direct download from GitHub releases
            SSHX_ARCH=$(uname -m)
            case "$SSHX_ARCH" in
              x86_64) SSHX_ARCH="x86_64" ;;
              aarch64|arm64) SSHX_ARCH="aarch64" ;;
            esac
            curl -sSL "https://github.com/ekzhang/sshx/releases/latest/download/sshx-${SSHX_ARCH}-unknown-linux-musl.tar.gz" -o /tmp/sshx.tgz
            tar -xzf /tmp/sshx.tgz -C /tmp
            mkdir -p "$HOME/.local/bin"
            mv /tmp/sshx "$HOME/.local/bin/sshx" || true
            chmod +x "$HOME/.local/bin/sshx" || true
          fi

          echo "====================================="
          echo "STARTING SSHX SESSION..."
          echo "====================================="

          # Start sshx as the custom user so files are owned correctly
          sudo -u "$USERNAME" -H bash -c '
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
            cd '"$GITHUB_WORKSPACE"'
            sshx -q > /tmp/sshx_url.txt 2>&1 &
            echo $! > /tmp/sshx.pid
          ' || \
          ( sshx -q > /tmp/sshx_url.txt 2>&1 & echo $! > /tmp/sshx.pid )

          sleep 10

          SSHX_URL=$(grep -oE 'https://sshx\.io/s/[A-Za-z0-9#/_-]+' /tmp/sshx_url.txt | head -n1)
          if [ -z "$SSHX_URL" ]; then
            SSHX_URL=$(grep -oE 'https://sshx\.io[^ ]*' /tmp/sshx_url.txt | head -n1)
          fi

          echo "sshx_url=$SSHX_URL" >> $GITHUB_OUTPUT

          echo "====================================="
          echo "🌐 YOUR ARIZNODES VPS LINK:"
          echo "$SSHX_URL"
          echo "====================================="
          echo "👤 Username: $USERNAME"
          echo "⏱️  Session hours requested: $SESSION_HOURS"
          echo "💾 Save files in the repo folder — auto-backed up every 30 min."
          echo "====================================="

          # Fail loudly if sshx failed
          if [ -z "$SSHX_URL" ]; then
            echo "❌ sshx failed to produce a URL. Raw output:"
            cat /tmp/sshx_url.txt || true
            exit 1
          fi

      - name: Save session marker to repo
        run: |
          mkdir -p .ariznodes
          cat > .ariznodes/session.json <<EOF
          {
            "session_id": "${{ steps.meta.outputs.session_id }}",
            "username": "${{ env.VPS_USER }}",
            "sshx_url": "${{ steps.start.outputs.sshx_url }}",
            "start_epoch": ${{ steps.meta.outputs.start_epoch }},
            "started_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}"
          }
          EOF
          cat .ariznodes/session.json

      - name: Configure git identity
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

      - name: Commit session marker
        run: |
          git add .ariznodes/session.json
          git commit -m "ARIZNODES: session started ${GITHUB_RUN_ID}" || echo "Nothing to commit"
          git push || echo "Push failed (may be read-only or no changes)"

  # ===========================================================================
  # JOB 2 — The actual VPS: runs 5h50m, keeps sshx alive, backs up, monitors
  # ===========================================================================
  VPS:
    name: "🖥️ ARIZNODES VPS (${{ needs.Bootstrap.outputs.session_id }})"
    needs: Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 360   # hard cap just under 6h
    steps:
      - name: Checkout Repo (Loading saved files)
        uses: actions/checkout@v4

      - name: Restore custom user
        run: |
          USERNAME="${{ env.VPS_USER }}"
          USERNAME=$(echo "$USERNAME" | tr -cd 'a-z0-9_-' | cut -c1-32)
          [ -z "$USERNAME" ] && USERNAME="ariznode"
          echo "USERNAME=$USERNAME" >> $GITHUB_ENV
          if ! id "$USERNAME" &>/dev/null; then
            sudo useradd -m -s /bin/bash "$USERNAME" || true
          fi
          echo "$USERNAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$USERNAME >/dev/null
          sudo chmod 440 /etc/sudoers.d/$USERNAME
          sudo chown -R "$USERNAME":"$USERNAME" "$GITHUB_WORKSPACE" || true
          echo "✅ Restored user $USERNAME"

      - name: Install base packages (again — fresh runner)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl wget git vim nano tmux screen htop btop neofetch \
            zip unzip tar gzip xz-utils jq python3 python3-pip \
            net-tools iputils-ping dnsutils traceroute \
            ca-certificates gnupg lsb-release software-properties-common \
            build-essential pkg-config libssl-dev \
            rsync nano less tree ncdu zsh fish 2>/dev/null || true

      - name: Install Docker (optional)
        if: ${{ env.ENABLE_DOCKER == 'true' }}
        run: |
          echo "Installing Docker..."
          curl -fsSL https://get.docker.com | sudo sh || echo "Docker install failed (non-fatal)"
          sudo usermod -aG docker "$USERNAME" || true
          sudo systemctl enable docker || true
          sudo systemctl start docker || true
          docker --version || echo "Docker not available"

      - name: Install dev tools (optional)
        if: ${{ env.ENABLE_DEV_TOOLS == 'true' }}
        run: |
          echo "Installing dev tools..."
          # Node.js via nvm (as user)
          sudo -u "$USERNAME" -H bash -c '
            export NVM_DIR="$HOME/.nvm"
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash || true
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm install --lts || true
            nvm use --lts || true
            node --version || true
            npm --version || true
          ' || true

          # Python venv + pipx
          sudo apt-get install -y -qq python3-venv pipx 2>/dev/null || true

          # Go
          GO_VERSION="1.22.5"
          curl -sSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz || true
          if [ -f /tmp/go.tgz ]; then
            sudo rm -rf /usr/local/go
            sudo tar -C /usr/local -xzf /tmp/go.tgz
            echo 'export PATH=$PATH:/usr/local/go/bin' | sudo tee /etc/profile.d/go.sh >/dev/null
          fi

          # Rust via rustup (as user)
          sudo -u "$USERNAME" -H bash -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y || true
            . "$HOME/.cargo/env" 2>/dev/null || true
            cargo --version || true
          ' || true

          echo "✅ Dev tools installed"

      - name: Setup shell environment for user
        run: |
          USER_HOME=$(getent passwd "$USERNAME" | cut -d: -f6)
          sudo bash -c "cat >> $USER_HOME/.bashrc" <<'EOF'
          # ARIZNODES environment
          export PATH="$HOME/.local/bin:/usr/local/go/bin:$HOME/.cargo/bin:$PATH"
          export EDITOR=vim
          alias ll='ls -lah'
          alias gs='git status'
          alias ..='cd ..'
          alias ...='cd ../..'
          PS1='\[\e[1;32m\]ARIZNODES\[\e[0m\]:\[\e[1;34m\]\w\[\e[0m\]\$ '
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          EOF
          sudo chown "$USERNAME":"$USERNAME" "$USER_HOME/.bashrc"
          # Also for root (in case user drops to root)
          sudo bash -c "cat >> /root/.bashrc" <<'EOF'
          export PATH="$HOME/.local/bin:/usr/local/go/bin:$HOME/.cargo/bin:$PATH"
          PS1='\[\e[1;31m\]ARIZNODES-ROOT\[\e[0m\]:\[\e[1;34m\]\w\[\e[0m\]\$ '
          EOF

      - name: Install monitoring tools (optional)
        if: ${{ env.ENABLE_MONITORING == 'true' }}
        run: |
          sudo apt-get install -y -qq htop btop neofetch ncdu 2>/dev/null || true
          # Install btop if not available
          if ! command -v btop &>/dev/null; then
            curl -sSL https://github.com/aristocratos/btop/releases/latest/download/btop-x86_64-linux-musl.tbz -o /tmp/btop.tbz 2>/dev/null || true
            if [ -f /tmp/btop.tbz ]; then
              tar -xjf /tmp/btop.tbz -C /tmp 2>/dev/null || true
              sudo cp /tmp/btop/bin/btop /usr/local/bin/btop 2>/dev/null || true
              sudo chmod +x /usr/local/bin/btop 2>/dev/null || true
            fi
          fi
          echo "✅ Monitoring installed"

      - name: Show VPS banner
        run: |
          echo "==============================================="
          echo "  █████╗ ██████╗ ██╗███████╗███╗   ██╗ ██████╗ "
          echo " ██╔══██╗██╔══██╗██║╚══███╔╝████╗  ██║██╔═══██╗"
          echo " ███████║██████╔╝██║  ███╔╝ ██╔██╗ ██║██║   ██║"
          echo " ██╔══██║██╔══██╗██║ ███╔╝  ██║╚██╗██║██║   ██║"
          echo " ██║  ██║██║  ██║██║███████╗██║ ╚████║╚██████╔╝"
          echo " ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝╚══════╝╚═╝  ╚═══╝ ╚═════╝ "
          echo "==============================================="
          echo "  Username:   $USERNAME"
          echo "  Session:    ${{ needs.Bootstrap.outputs.session_id }}"
          echo "  Link:       ${{ needs.Bootstrap.outputs.sshx_url }}"
          echo "  Runtime:    ${KEEPALIVE_MAX_MIN}m this job (~6h cap)"
          echo "  Total goal: ${SESSION_HOURS}h (auto-redispatch)"
          echo "  Backup:     every ${BACKUP_INTERVAL_SEC}s"
          echo "==============================================="

      - name: Start sshx (fresh link for this job)
        id: sshx
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          if ! command -v sshx &>/dev/null; then
            curl -sSf https://sshx.io/get | sh -s -- -y >/dev/null 2>&1 || \
            curl -sSf https://sshx.io/get | bash || true
          fi
          sudo -u "$USERNAME" -H bash -c '
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
            cd '"$GITHUB_WORKSPACE"'
            sshx -q > /tmp/sshx_url.txt 2>&1 &
            echo $! > /tmp/sshx.pid
          ' || ( sshx -q > /tmp/sshx_url.txt 2>&1 & echo $! > /tmp/sshx.pid )
          sleep 10
          SSHX_URL=$(grep -oE 'https://sshx\.io/s/[A-Za-z0-9#/_-]+' /tmp/sshx_url.txt | head -n1)
          [ -z "$SSHX_URL" ] && SSHX_URL=$(grep -oE 'https://sshx\.io[^ ]*' /tmp/sshx_url.txt | head -n1)
          echo "sshx_url=$SSHX_URL" >> $GITHUB_OUTPUT
          echo "====================================="
          echo "🌐 THIS JOB'S SSHX LINK:"
          echo "$SSHX_URL"
          echo "====================================="

      - name: Background — sshx watchdog (restart if dies)
        run: |
          (
            while true; do
              sleep 300
              if ! pgrep -f "sshx" >/dev/null 2>&1; then
                echo "[watchdog] sshx died, restarting at $(date)"
                sudo -u "$USERNAME" -H bash -c '
                  export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
                  cd '"$GITHUB_WORKSPACE"'
                  sshx -q > /tmp/sshx_url.txt 2>&1 &
                ' || ( sshx -q > /tmp/sshx_url.txt 2>&1 & )
                sleep 5
                grep -oE 'https://sshx\.io/s/[A-Za-z0-9#/_-]+' /tmp/sshx_url.txt | head -n1 || true
              fi
            done
          ) &

      - name: Background — auto-backup every 30 min
        run: |
          (
            while true; do
              sleep "$BACKUP_INTERVAL_SEC"
              cd $GITHUB_WORKSPACE || exit 0
              git config user.name "$GIT_USER_NAME"
              git config user.email "$GIT_USER_EMAIL"
              git add . 2>/dev/null || true
              if ! git diff --cached --quiet 2>/dev/null; then
                git commit -m "Auto-backup of VPS files at $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
                git push || echo "Push failed, will retry next cycle."
              else
                echo "Nothing new to save at $(date)"
              fi
            done
          ) &

      - name: Background — health monitor + stats
        run: |
          (
            while true; do
              sleep 600
              echo "===== HEALTH @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
              uptime || true
              free -h || true
              df -h / || true
              echo "sshx alive: $(pgrep -f sshx >/dev/null && echo yes || echo no)"
              echo "user shell: $(pgrep -u "$USERNAME" -c || true) processes"
              echo "====================================="
            done
          ) &

      - name: Background — auto-cleanup caches
        run: |
          (
            while true; do
              sleep 3600
              echo "[cleanup] $(date): pruning caches..."
              sudo apt-get autoremove -y -qq 2>/dev/null || true
              sudo apt-get clean -qq 2>/dev/null || true
              # Trim /tmp older than 1h
              find /tmp -type f -mmin +60 -delete 2>/dev/null || true
              # Trim npm cache
              sudo -u "$USERNAME" -H bash -c 'npm cache clean --force 2>/dev/null || true' || true
              docker system prune -af --volumes 2>/dev/null || true
              echo "[cleanup] done"
            done
          ) &

      - name: Keep Alive — sleep until 5h50m
        run: |
          echo "VPS is running. Sleeping ${KEEPALIVE_MAX_MIN} minutes to keep it alive..."
          echo "Monitor the live log above for health stats every 10 min."
          sleep ${KEEPALIVE_MAX_MIN}m

  # ===========================================================================
  # JOB 3 — Self-Redispatch: chain another run to reach SESSION_HOURS total
  # ===========================================================================
  Redispatch:
    name: "🔁 Self-Redispatch (to reach ${{ env.SESSION_HOURS }}h total)"
    needs: [Bootstrap, VPS]
    if: always() && needs.VPS.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo (Loading saved files)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore git identity
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

      - name: Read session start time & compute elapsed
        id: elapsed
        run: |
          if [ -f .ariznodes/session.json ]; then
            START_EPOCH=$(jq -r '.start_epoch' .ariznodes/session.json)
          else
            START_EPOCH=$(date +%s)
          fi
          NOW=$(date +%s)
          ELAPSED_SEC=$(( NOW - START_EPOCH ))
          ELAPSED_H=$(( ELAPSED_SEC / 3600 ))
          TARGET_H=$(( SESSION_HOURS ))
          echo "start_epoch=$START_EPOCH" >> $GITHUB_OUTPUT
          echo "elapsed_sec=$ELAPSED_SEC" >> $GITHUB_OUTPUT
          echo "elapsed_h=$ELAPSED_H" >> $GITHUB_OUTPUT
          echo "target_h=$TARGET_H" >> $GITHUB_OUTPUT
          echo "Elapsed: ${ELAPSED_H}h / Target: ${TARGET_H}h"
          if [ "$ELAPSED_H" -lt "$TARGET_H" ]; then
            echo "should_redispatch=true" >> $GITHUB_OUTPUT
          else
            echo "should_redispatch=false" >> $GITHUB_OUTPUT
            echo "🎉 Target reached! Stopping redispatch."
          fi

      - name: Self-redispatch workflow
        if: steps.elapsed.outputs.should_redispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Redispatching to continue for another ~6h..."
          gh workflow run ariznodes.yml \
            -f custom_username="${VPS_USER}" \
            -f session_hours="${SESSION_HOURS}" \
            -f enable_docker="${ENABLE_DOCKER}" \
            -f enable_dev_tools="${ENABLE_DEV_TOOLS}" \
            -f enable_monitoring="${ENABLE_MONITORING}" \
            || echo "⚠️ Redispatch failed (may lack actions:write or PAT). Manual restart needed."
          echo "✅ Redispatch requested"

      - name: Mark session complete in repo
        if: steps.elapsed.outputs.should_redispatch == 'false'
        run: |
          mkdir -p .ariznodes
          cat > .ariznodes/complete.json <<EOF
          {
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "total_elapsed_h": ${{ steps.elapsed.outputs.elapsed_h }},
            "target_h": ${{ steps.elapsed.outputs.target_h }}
          }
          EOF
          git add .ariznodes/complete.json
          git commit -m "ARIZNODES: session complete" || true
          git push || true

  # ===========================================================================
  # JOB 4 — Cleanup & summary (always runs, reports what happened)
  # ===========================================================================
  Summary:
    name: "📊 Final Report"
    needs: [Bootstrap, VPS, Redispatch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo (Loading saved files)
        uses: actions/checkout@v4

      - name: Print final summary
        run: |
          echo "==============================================="
          echo "        ARIZNODES — SESSION SUMMARY"
          echo "==============================================="
          echo "Session ID:   ${{ needs.Bootstrap.outputs.session_id }}"
          echo "Bootstrap:    ${{ needs.Bootstrap.result }}"
          echo "VPS:          ${{ needs.VPS.result }}"
          echo "Redispatch:   ${{ needs.Redispatch.result }}"
          echo "Username:     ${VPS_USER}"
          echo "Target hours: ${SESSION_HOURS}"
          echo "==============================================="
          if [ -f .ariznodes/session.json ]; then
            echo "Session file:"
            cat .ariznodes/session.json
          fi
          echo "==============================================="

      - name: Commit final state
        if: always()
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          mkdir -p .ariznodes
          cat > .ariznodes/last_run.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "finished_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "bootstrap_result": "${{ needs.Bootstrap.result }}",
            "vps_result": "${{ needs.VPS.result }}",
            "redispatch_result": "${{ needs.Redispatch.result }}"
          }
          EOF
          git add .ariznodes/ 2>/dev/null || true
          git commit -m "ARIZNODES: final report for run ${GITHUB_RUN_ID}" || echo "Nothing to commit"
          git push || echo "Push failed"
